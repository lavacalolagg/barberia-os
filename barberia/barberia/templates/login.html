<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso Staff — NOIR & GOLD</title>
<meta name="theme-color" content="#08070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .login-card { width: 100%; max-width: 380px; }
  .login-brand {
    width: 56px; height: 56px; border-radius: 50%;
    background: conic-gradient(from 180deg, var(--gold), var(--neon-cyan), var(--gold));
    display: grid; place-items: center;
    font-family: var(--font-display); color: var(--bg-void); font-size: 20px;
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(212,175,55,0.45);
  }
  .login-error {
    background: rgba(255,84,112,0.12);
    border: 1px solid rgba(255,84,112,0.4);
    color: #ff8fa3;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="glass-panel pad-lg login-card">
    <div class="login-brand">N</div>
    <h1 style="text-align:center; font-size:22px; margin-bottom:6px;">Acceso de Staff</h1>
    <p style="text-align:center; margin-bottom:22px;">Solo para dueño y barberos — el área de reservaciones sigue siendo pública.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Usuario</label>
        <input type="text" name="usuario" autofocus required placeholder="admin" autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold btn-block">Entrar</button>
    </form>

    <p class="text-faint mt-lg" style="text-align:center; font-size:12px;">
      <a href="/">← Volver a reservaciones</a>
    </p>
  </div>
</div>
</body>
</html>
